<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hardcopy | Shadowrun World Engine</title>
  <link rel="stylesheet" href="style.css">
  <script src="shared.js"></script>
  <style>
    .hc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:8px;}
    .hc-card{background:var(--bg-panel,#0d1512);border:1px solid #1c2b22;border-radius:4px;padding:14px 16px;
      cursor:pointer;text-align:left;font-family:inherit;transition:border-color .12s;}
    .hc-card:hover{border-color:var(--green);}
    .hc-card__n{color:var(--text-bright);font-size:.95rem;letter-spacing:.5px;}
    .hc-card__m{color:var(--text-dim);font-size:.7rem;letter-spacing:1px;text-transform:uppercase;margin-top:4px;}
    .hc-card__pdf{color:var(--green);font-size:.62rem;letter-spacing:1px;text-transform:uppercase;margin-top:10px;}
    .hc-card.is-busy{opacity:.5;cursor:default;}
  </style>
</head>
<body>

<header>
  <div class="logo">Shadowrun <em>//</em> <span class="text-cyan" style="text-shadow: var(--glow-cyan)">NA/UCAS-SEA-6A23D-PENUMBRA</span></div>
  <nav>
    <a href="world-state.html">World State</a>
    <a href="manage-characters.html">Characters</a>
    <a href="manage-organizations.html">Organizations</a>
    <a href="manage-locations.html">Locations</a>
    <a href="manage-runs.html">Runs</a>
  </nav>
</header>

<main>
  <div class="page-title">&gt;&gt; Hardcopy <em class="sep">//</em> Character Sheets</div>
  <div class="page-sub" style="color:var(--green)">CLICK A RUNNER TO DOWNLOAD THEIR FILLED SR2 SHEET (PDF)</div>

  <div id="alert" class="alert"></div>
  <div id="hcList"><div class="loading">Loading runners</div></div>
</main>

<script>
async function loadRunners() {
  const listEl = document.getElementById('hcList');
  try {
    const [chars, mine] = await Promise.all([
      apiFetch('/characters/?is_pc=true&is_active=true').then(r => r.ok ? r.json() : []),
      apiFetch('/characters/mine').then(r => r.ok ? r.json() : { ids: [] }).catch(() => ({ ids: [] })),
    ]);
    const myIds = new Set((mine && mine.ids) || []);
    const admin = isAdminMode();
    const owned = (Array.isArray(chars) ? chars : []).filter(c => admin || myIds.has(c.id));
    if (!owned.length) {
      listEl.innerHTML = `<p class="empty-state">No published runners yet. Build one under Characters &rsaquo; New Runner.</p>`;
      return;
    }
    owned.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
    listEl.innerHTML = `<div class="hc-grid">${owned.map(c => `
      <button type="button" class="hc-card" data-id="${c.id}" data-name="${esc(c.name || '')}">
        <div class="hc-card__n">${esc(c.name || 'Unnamed')}</div>
        <div class="hc-card__m">${esc(c.archetype || 'Runner')}${c.race ? ' &middot; ' + esc(c.race) : ''}</div>
        <div class="hc-card__pdf">&#8595; Generate PDF</div>
      </button>`).join('')}</div>`;
    listEl.querySelectorAll('[data-id]').forEach(el =>
      el.onclick = () => downloadSheet(el, Number(el.dataset.id), el.dataset.name));
  } catch (e) {
    showAlert(document.getElementById('alert'), `>> LOAD FAILED // ${e.message}`, true);
  }
}

async function downloadSheet(card, id, name) {
  if (card.classList.contains('is-busy')) return;
  card.classList.add('is-busy');
  try {
    const res = await apiFetch(`/characters/${id}/sheet.pdf`);
    if (!res.ok) { showAlert(document.getElementById('alert'), `>> PDF FAILED // status ${res.status}`, true); return; }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (name || ('character_' + id)).replace(/[^A-Za-z0-9._-]+/g, '_') + '_SR2.pdf';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    showAlert(document.getElementById('alert'), `>> GENERATED // ${name || id}`, false);
  } catch (e) {
    showAlert(document.getElementById('alert'), `>> PDF FAILED // ${e.message}`, true);
  } finally {
    card.classList.remove('is-busy');
  }
}

bootstrapAuth().then(u => { if (u) loadRunners(); });
</script>
</body>
</html>
