<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Runner Sheet | Shadowrun World Engine</title>
  <link rel="stylesheet" href="style.css">
  <script src="shared.js"></script>
  <style>
    .csheet-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 16px;margin-bottom:6px;}
    .csheet-head h1{font-family:var(--font-display);font-size:var(--fs-xxl);letter-spacing:2px;color:var(--text-bright);margin:0;}
    .csheet-head .csheet-sub{color:var(--cyan);letter-spacing:1px;}
    .csheet-meta{color:var(--text-dim);font-size:var(--fs-sm);margin-bottom:22px;}
    .csheet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px;margin-bottom:8px;}
    .csheet-stat{background:var(--bg-input);border:1px solid #1a2a1a;padding:8px 10px;text-align:center;}
    .csheet-stat b{display:block;font-family:var(--font-display);font-size:var(--fs-xl);color:var(--green);line-height:1;}
    .csheet-stat span{display:block;font-size:var(--fs-xxs);letter-spacing:2px;color:var(--text-dim);text-transform:uppercase;margin-top:5px;}
    .csheet-stat.is-cyan b{color:var(--cyan);}
    .csheet-stat.is-amber b{color:var(--amber);}
    .csheet-block{margin:26px 0;}
    .csheet-list{list-style:none;margin:0;padding:0;}
    .csheet-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;padding:6px 0;border-bottom:1px solid #141c14;}
    .csheet-row .n{color:var(--text-bright);}
    .csheet-row .r{color:var(--cyan);font-family:var(--font-display);margin-left:auto;}
    .csheet-row .m{color:var(--text-dim);font-size:var(--fs-xs);}
    .csheet-tiers{color:var(--text-dim);font-size:var(--fs-xs);flex-basis:100%;padding-left:2px;}
    .csheet-tiers strong{color:var(--cyan);}
    .csheet-cols{display:grid;grid-template-columns:1fr 1fr;gap:8px 26px;}
    @media (max-width:720px){.csheet-cols{grid-template-columns:1fr;}}
    .csheet-life{color:var(--text-dim);font-size:var(--fs-sm);}
    .csheet-life strong{color:var(--text-bright);}
    .csheet-lifeform{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-top:12px;
      padding-top:12px;border-top:1px solid #141c14;}
    .csheet-lifeform label{display:flex;flex-direction:column;gap:4px;font-size:var(--fs-xxs);
      letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);}
    .csheet-lifeform select,.csheet-lifeform input[type=number]{background:var(--bg-input);
      border:1px solid #1a2a1a;color:var(--text-bright);padding:6px 8px;font-family:inherit;font-size:var(--fs-sm);}
    .csheet-lifeperm{flex-direction:row!important;align-items:center;text-transform:none!important;}
    .csheet-lifeperm input{width:auto;}
    #lifeCost{color:var(--cyan);}
    #lifeCost.is-over{color:var(--red);}
    .csheet-back{margin-bottom:18px;display:inline-block;}
  </style>
</head>
<body>

<header>
  <div class="logo">Shadowrun <em>//</em> <span class="text-cyan" style="text-shadow: var(--glow-cyan)">NA/UCAS-SEA-6A23D-PENUMBRA</span></div>
  <nav>
    <a href="world-state.html">World State</a>
    <a href="manage-characters.html" class="active">Characters</a>
    <a href="manage-organizations.html">Organizations</a>
    <a href="manage-locations.html">Locations</a>
    <a href="manage-rtgs.html">RTGs</a>
    <a href="manage-runs.html">Runs</a>
    <a href="deck-workshop.html">Deck Workshop</a>
    <a href="matrix-run.html">Matrix Run</a>
    <a href="matrix-designer.html" class="gm-only">Matrix Designer</a>
  </nav>
</header>

<main>
  <a class="btn btn-sm csheet-back" href="manage-characters.html">&lsaquo; Back to Characters</a>
  <div id="alert" class="alert"></div>
  <div id="sheet"><div class="loading">Loading sheet</div></div>
</main>

<script>
const money = (n) => (Number(n) || 0).toLocaleString("en-US") + "\u00A5";
const num = (v) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const LIFESTYLE_TIERS = ["Street", "Squatter", "Low", "Middle", "High", "Luxury"];
const LIFESTYLE_MONTHLY = [0, 100, 1000, 5000, 10000, 100000];
const LIFESTYLE_PERMANENT_MONTHS = 100;

// Concentration / Specialization effective ratings (SR2 p.70) -- mirrors the builder.
function skillTiers(s) {
  const base = num(s.rating);
  const conc = (s.conc || "").trim();
  const spec = (s.spec || "").trim();
  const lo = n => Math.max(0, n);
  if (conc && spec) return [
    { label: s.name, rating: lo(base - 2) },
    { label: `${s.name} (${conc})`, rating: lo(base) },
    { label: `${s.name}: ${spec}`, rating: lo(base + 2) },
  ];
  if (conc) return [
    { label: s.name, rating: lo(base - 1) },
    { label: `${s.name} (${conc})`, rating: lo(base + 1) },
  ];
  return [{ label: s.name, rating: lo(base) }];
}
function tiersHTML(s) {
  const t = skillTiers(s);
  if (t.length === 1) return "";
  return `<div class="csheet-tiers">${t.map(x => `${esc(x.label)} <strong>${x.rating}</strong>`).join(" &middot; ")}</div>`;
}

function statCard(label, value, cls) {
  return `<div class="csheet-stat ${cls || ""}"><b>${esc(String(value))}</b><span>${esc(label)}</span></div>`;
}

function block(title, inner) {
  return `<div class="csheet-block"><div class="section-head">${esc(title)}</div>${inner}</div>`;
}

function skillRow(s) {
  const attr = s.attr ? ` <span class="m">(${esc(s.attr)})</span>` : "";
  return `<li class="csheet-row"><span class="n">${esc(s.name || "?")}</span>${attr}
    <span class="r">${num(s.rating)}</span>${tiersHTML(s)}</li>`;
}

function gearBucketHTML(label, items, fmt) {
  if (!Array.isArray(items) || !items.length) return "";
  const rows = items.map(fmt).join("");
  return `<div class="csheet-block"><div class="sub-head">${esc(label)}</div><ul class="csheet-list">${rows}</ul></div>`;
}

function renderSheet(c, contacts, decks, canManage) {
  const attrs = [
    ["Body", c.body], ["Quickness", c.quickness], ["Strength", c.strength],
    ["Charisma", c.charisma], ["Intelligence", c.intelligence], ["Willpower", c.willpower],
  ];
  const reaction = Math.floor((num(c.quickness) + num(c.intelligence)) / 2);
  const combatPool = Math.floor((num(c.quickness) + num(c.intelligence) + num(c.willpower)) / 2);

  const skills = Array.isArray(c.skills) ? c.skills : [];
  const active = skills.filter(s => s.group !== "knowledge" && s.group !== "language");
  const knowledge = skills.filter(s => s.group === "knowledge");
  const languages = skills.filter(s => s.group === "language");

  const gear = c.gear || {};
  const foci = Array.isArray(gear.foci) ? gear.foci : [];

  // Dice pools (mirror the builder): shown only when the requirement is met AND the value > 0.
  const poolBonus = (name) => {
    let t = 0;
    ["cyber", "bio"].forEach(k => (gear[k] || []).forEach(g => {
      const tbl = g.poolTbl && g.poolTbl[name];
      if (tbl) t += Number(tbl[(Number(g.rating) || 1) - 1]) || 0;
    }));
    return t;
  };
  const combatPoolFull = combatPool + poolBonus("combat");
  const deckMpcp = Math.max(0,
    ...(gear.matrix || []).map(g => Number(g.mpcp) || 0),
    ...(Array.isArray(decks) ? decks : []).map(d => Number(d.mpcp) || 0));
  const vcrLvl = (gear.cyber || []).reduce((mx, g) => { const m = /vehicle control rig level (\d)/i.exec(g.n || ""); return m ? Math.max(mx, Number(m[1])) : mx; }, 0);
  const hasSorcery = (Array.isArray(c.skills) ? c.skills : []).some(s => s.name === "Sorcery");
  const taskPool = poolBonus("task");
  const hackingPool = deckMpcp ? Math.floor((num(c.intelligence) + deckMpcp) / 3) + poolBonus("hack") : null;
  const controlPool = vcrLvl ? reaction + vcrLvl * 2 + vcrLvl : null;
  const astralPool = c.magic_type === "Full Mage" ? Math.floor((num(c.intelligence) + num(c.willpower) + num(c.charisma)) / 2) : null;
  const spellPool = hasSorcery ? Math.floor((num(c.intelligence) + num(c.willpower) + num(c.magic_rating)) / 3) : null;
  const poolCards = [];
  const addPool = (label, v) => { if (v != null && v > 0) poolCards.push(statCard(label, v, "is-cyan")); };
  addPool("Task Pool", taskPool);
  addPool("Hacking Pool", hackingPool);
  addPool("Control Pool", controlPool);
  addPool("Astral Pool", astralPool);
  addPool("Spell Pool", spellPool);

  let html = "";

  // Identity ---------------------------------------------------------------
  const magicTag = c.magic_type ? ` &middot; <span class="text-amber">${esc(c.magic_type)}</span>` : "";
  html += `<div class="csheet-head"><h1>${esc(c.name || "Unnamed Runner")}</h1>
    <span class="csheet-sub">${esc(c.race || "Human")}${magicTag}</span></div>`;
  const bits = [];
  if (c.lifestyle_name) bits.push(`Lifestyle: ${esc(c.lifestyle_name)}`);
  if (c.gender) bits.push(esc(c.gender));
  if (c.age != null) bits.push(`Age ${esc(String(c.age))}`);
  bits.push(`ID ${esc(String(c.id))}`);
  html += `<div class="csheet-meta">${bits.join(" &middot; ")}</div>`;
  if (c.description) html += `<p class="csheet-meta" style="max-width:70ch">${esc(c.description)}</p>`;

  // Attributes -------------------------------------------------------------
  html += block("Attributes", `<div class="csheet-grid">${attrs.map(a => statCard(a[0], num(a[1]))).join("")}</div>`);

  // Derived / resources ----------------------------------------------------
  const derived = [
    statCard("Essence", num(c.essence).toFixed(2), "is-cyan"),
    statCard("Body Index", num(c.body_index).toFixed(2), "is-cyan"),
    statCard("Magic", num(c.magic_rating), "is-amber"),
    statCard("Reaction", reaction, "is-cyan"),
    statCard("Combat Pool", combatPoolFull, "is-cyan"),
    poolCards.join(""),
    statCard("Karma Pool", num(c.karma_pool), "is-amber"),
    statCard("Good Karma", num(c.good_karma), "is-amber"),
    statCard("Nuyen", money(c.nuyen), ""),
  ].join("");
  html += block("Derived &amp; Resources", `<div class="csheet-grid">${derived}</div>`);

  // Lifestyle (with owner/admin purchase controls) -------------------------
  html += block("Lifestyle", lifestylePanelHTML(c, canManage));

  // Magic ------------------------------------------------------------------
  if (c.magic_type) {
    const mrows = [];
    mrows.push(`<li class="csheet-row"><span class="n">Type</span><span class="r">${esc(c.magic_type)}</span></li>`);
    if (c.tradition) mrows.push(`<li class="csheet-row"><span class="n">Tradition</span><span class="r">${esc(c.tradition)}</span></li>`);
    if (c.totem) mrows.push(`<li class="csheet-row"><span class="n">Totem</span><span class="r">${esc(c.totem)}</span></li>`);
    let magicInner = `<ul class="csheet-list">${mrows.join("")}</ul>`;

    const spells = Array.isArray(c.spells) ? c.spells : [];
    if (spells.length) {
      magicInner += `<div class="csheet-block"><div class="sub-head">Spells</div><ul class="csheet-list">` +
        spells.map(s => `<li class="csheet-row"><span class="n">${esc(s.name || "?")}</span>
          <span class="m">${esc(s.cat || "")}</span><span class="r">Force ${num(s.force)}</span></li>`).join("") +
        `</ul></div>`;
    }
    const powers = Array.isArray(c.adept_powers) ? c.adept_powers : [];
    if (powers.length) {
      magicInner += `<div class="csheet-block"><div class="sub-head">Adept Powers</div><ul class="csheet-list">` +
        powers.map(p => {
          const lvl = p.rated ? ` <span class="m">Lv ${num(p.lvl) || 1}</span>` : "";
          const pp = round2(num(p.ppEach) * (p.rated ? (num(p.lvl) || 1) : 1));
          return `<li class="csheet-row"><span class="n">${esc(p.name || "?")}</span>${lvl}<span class="r">${pp} PP</span></li>`;
        }).join("") + `</ul></div>`;
    }
    if (foci.length) {
      magicInner += `<div class="csheet-block"><div class="sub-head">Foci</div><ul class="csheet-list">` +
        foci.map(f => {
          const rate = f.rating ? ` <span class="m">Rating ${num(f.rating)}</span>` : "";
          const app = f.applies ? ` <span class="m">&middot; ${esc(f.applies)}</span>` : "";
          return `<li class="csheet-row"><span class="n">${esc(f.type || "Focus")}</span>${rate}${app}</li>`;
        }).join("") + `</ul></div>`;
    }
    html += block("Magic", magicInner);
  }

  // Skills -----------------------------------------------------------------
  let skillInner = "";
  if (active.length) skillInner += `<div class="sub-head">Active Skills</div><ul class="csheet-list">${active.map(skillRow).join("")}</ul>`;
  if (knowledge.length) skillInner += `<div class="csheet-block"><div class="sub-head">Knowledge Skills</div><ul class="csheet-list">${knowledge.map(skillRow).join("")}</ul></div>`;
  if (languages.length) {
    skillInner += `<div class="csheet-block"><div class="sub-head">Languages</div><ul class="csheet-list">` +
      languages.map(l => {
        const free = l.free ? ` <span class="m">(free${l.kind === "native" ? ", native" : l.kind === "dialect" ? ", dialect" : ""})</span>` : "";
        return `<li class="csheet-row"><span class="n">${esc(l.name || "?")}</span>${free}<span class="r">${num(l.rating)}</span></li>`;
      }).join("") + `</ul></div>`;
  }
  if (!skillInner) skillInner = `<p class="empty-state">No skills recorded.</p>`;
  html += block("Skills", skillInner);

  // Gear -------------------------------------------------------------------
  const gearHTML =
    gearBucketHTML("Weapons", gear.weapons, g => `<li class="csheet-row"><span class="n">${esc(g.name || g.n || "?")}</span>
      <span class="r">${money(g.cost)}</span></li>`) +
    gearBucketHTML("Armor", gear.armor, g => `<li class="csheet-row"><span class="n">${esc(g.name || g.n || "?")}</span>
      <span class="r">${money(g.cost)}</span></li>`) +
    gearBucketHTML("Cyberware", gear.cyber, g => {
      const grade = g.grade ? ` <span class="m">${esc(g.grade)}</span>` : "";
      const ess = (g.baseEss != null) ? ` <span class="m">Ess base ${num(g.baseEss).toFixed(2)}</span>` : "";
      return `<li class="csheet-row"><span class="n">${esc(g.name || g.n || "?")}</span>${grade}${ess}
        <span class="r">${money(g.baseCost != null ? g.baseCost : g.cost)}</span></li>`;
    }) +
    gearBucketHTML("Bioware", gear.bio, g => `<li class="csheet-row"><span class="n">${esc(g.name || g.n || "?")}</span>
      <span class="r">${money(g.cost)}</span></li>`) +
    gearBucketHTML("Gear", gear.gear, g => `<li class="csheet-row"><span class="n">${esc(g.name || g.n || "?")}</span>
      <span class="r">${money(g.cost)}</span></li>`) +
    gearBucketHTML("Vehicles &amp; Drones", gear.vehicles, g => {
      const rigCost = g.rigger ? (Number(g.body) || 0) * 2500 + 2800 : 0;
      const rigTag = g.rigger ? ` <span class="m">+ rigger adaptation</span>` : "";
      return `<li class="csheet-row"><span class="n">${esc(g.name || g.n || "?")}</span>${rigTag}
        <span class="r">${money((Number(g.cost) || 0) + rigCost)}</span></li>`;
    });
  html += block("Gear &amp; Cyberware", gearHTML || `<p class="empty-state">No gear recorded.</p>`);

  // Deck -------------------------------------------------------------------
  if (Array.isArray(decks) && decks.length) {
    const drows = decks.map(d => `<li class="csheet-row"><span class="n">${esc(d.name || "Cyberdeck")}</span>
      <span class="m">MPCP ${num(d.mpcp)}</span><span class="r">${esc(d.deckType || "")}</span></li>`).join("");
    html += block("Cyberdeck", `<ul class="csheet-list">${drows}</ul>`);
  }

  // Contacts ---------------------------------------------------------------
  if (Array.isArray(contacts) && contacts.length) {
    const crows = contacts.map(ct => `<li class="csheet-row"><span class="n">${esc(ct.name || "?")}</span>
      <span class="m">${esc(ct.profession || "")}</span>
      <span class="r">C${num(ct.connection)} / L${num(ct.loyalty)}</span></li>`).join("");
    html += block("Contacts", `<ul class="csheet-list">${crows}</ul>`);
  }

  document.getElementById("sheet").innerHTML = html;
  wireLifestyle(c, canManage);
}

// ---- lifestyle management ------------------------------------------------
function lifestylePanelHTML(c, canManage) {
  const curLvl = (c.lifestyle_level != null) ? c.lifestyle_level : 0;
  const monthly = num(c.lifestyle_monthly_cost);
  const status = c.lifestyle_permanent
    ? `<strong>${esc(c.lifestyle_name || LIFESTYLE_TIERS[curLvl] || "Street")}</strong> &mdash; permanent (no upkeep)`
    : (c.lifestyle_name
        ? `<strong>${esc(c.lifestyle_name)}</strong>${monthly > 0 ? ` &mdash; ${money(monthly)}/month upkeep` : " &mdash; no upkeep"}`
        : "<strong>None set</strong>");
  let inner = `<div class="csheet-life"><p>Current: ${status}</p>
    <p class="m">Nuyen on hand: ${money(c.nuyen)}</p>`;
  if (canManage) {
    inner += `<div class="csheet-lifeform">
      <label>Lifestyle <select id="lifeLevel">${LIFESTYLE_TIERS.map((t, i) =>
        `<option value="${i}" ${i === curLvl ? "selected" : ""}>${esc(t)}</option>`).join("")}</select></label>
      <label>Months <input type="number" id="lifeMonths" min="0" max="120" value="1"></label>
      <label class="csheet-lifeperm"><input type="checkbox" id="lifePerm"> Buy permanent (100 months)</label>
      <div id="lifeCost" class="m"></div>
      <button class="btn btn-green" id="lifeBuy">Purchase</button>
      <div id="lifeMsg" class="m"></div>
    </div>`;
  }
  return inner + "</div>";
}

function wireLifestyle(c, canManage) {
  if (!canManage) return;
  const levelEl = document.getElementById("lifeLevel");
  const monthsEl = document.getElementById("lifeMonths");
  const permEl = document.getElementById("lifePerm");
  const costEl = document.getElementById("lifeCost");
  const buyEl = document.getElementById("lifeBuy");
  const msgEl = document.getElementById("lifeMsg");
  if (!levelEl || !buyEl) return;

  const total = () => {
    const monthly = LIFESTYLE_MONTHLY[Number(levelEl.value)] || 0;
    return permEl.checked ? monthly * LIFESTYLE_PERMANENT_MONTHS : monthly * Math.max(0, Number(monthsEl.value) || 0);
  };
  const refresh = () => {
    monthsEl.disabled = permEl.checked;
    const t = total();
    const over = t > num(c.nuyen);
    costEl.textContent = `Cost: ${money(t)}${over ? " -- insufficient nuyen" : ""}`;
    costEl.classList.toggle("is-over", over);
    buyEl.disabled = over;
  };
  levelEl.onchange = refresh;
  monthsEl.oninput = refresh;
  permEl.onchange = refresh;
  refresh();

  buyEl.onclick = async () => {
    buyEl.disabled = true;
    msgEl.textContent = "Purchasing...";
    try {
      const body = { level: Number(levelEl.value), permanent: permEl.checked, months: Math.max(0, Number(monthsEl.value) || 0) };
      const r = await apiFetch(`/characters/${c.id}/lifestyle`, { method: "POST", body: JSON.stringify(body) });
      if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.detail || ("status " + r.status)); }
      loadSheet();  // reload with the updated lifestyle + nuyen
    } catch (e) {
      msgEl.textContent = "Failed: " + (e.message || e);
      buyEl.disabled = false;
    }
  };
}

function round2(n) { return Math.round((Number(n) || 0) * 100) / 100; }

async function readyDecksFor(id) {
  try {
    const r = await apiFetch(`/characters/${id}/deck-builder-state`);
    if (!r.ok) return [];
    const state = (await r.json()).state || {};
    const decks = Array.isArray(state.decks) ? state.decks : [];
    return decks.filter(d => String(d && d.status || "").toLowerCase() === "ready");
  } catch (_) { return []; }
}

async function loadSheet() {
  const id = new URLSearchParams(location.search).get("id");
  const wrap = document.getElementById("sheet");
  if (!id) { wrap.innerHTML = `<p class="empty-state">No character id in the URL (expected ?id=NUMBER).</p>`; return; }
  const res = await apiFetch(`/characters/${encodeURIComponent(id)}`);
  if (!res.ok) {
    wrap.innerHTML = `<p class="empty-state">Could not load character ${esc(id)} (status ${res.status}).</p>`;
    return;
  }
  const c = await res.json();
  const [contacts, decks, mine] = await Promise.all([
    apiFetch(`/contacts/?owner_id=${encodeURIComponent(id)}`).then(r => r.ok ? r.json() : []).catch(() => []),
    readyDecksFor(id),
    apiFetch(`/characters/mine`).then(r => r.ok ? r.json() : { ids: [] }).catch(() => ({ ids: [] })),
  ]);
  const canManage = (typeof isAdmin === "function" && isAdmin()) || (mine.ids || []).includes(Number(id));
  document.title = `${c.name || "Runner"} | Runner Sheet`;
  renderSheet(c, contacts, decks, canManage);
}

bootstrapAuth().then((u) => { if (u) loadSheet(); });
</script>
</body>
</html>
