<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gear Catalog | Shadowrun World Engine</title>
  <link rel="stylesheet" href="style.css">
  <script src="shared.js"></script>
  <script src="catalog-taxonomy.js"></script>
  <style>
    .gc-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
    .gc-toolbar input[type=text]{width:320px;}
    .gc-grid{display:grid;grid-template-columns:minmax(280px,1fr) minmax(320px,1.4fr) minmax(260px,.9fr);gap:14px;align-items:start;}
    @media (max-width:1100px){.gc-grid{grid-template-columns:1fr;}}
    .gc-panel{background:var(--bg-panel,#0d1512);border:1px solid #1c2b22;border-radius:4px;padding:12px 14px;}
    .gc-panel__h{color:var(--text-bright);font-size:.7rem;letter-spacing:1px;text-transform:uppercase;margin:0 0 8px;border-bottom:1px solid #142019;padding-bottom:6px;}
    .gc-list{max-height:70vh;overflow:auto;}
    .gc-cat{color:var(--green-dim,#7fae86);font-size:.6rem;letter-spacing:1px;text-transform:uppercase;margin:10px 0 4px;}
    .gc-subcat{color:var(--cyan);font-size:.58rem;letter-spacing:1px;text-transform:uppercase;margin:6px 0 2px 8px;}
    .gc-item{display:flex;justify-content:space-between;gap:8px;padding:4px 6px;border-radius:3px;cursor:pointer;font-size:.78rem;}
    .gc-item:hover{background:#122019;}
    .gc-item.is-sel{background:#16281e;color:var(--text-bright);}
    .gc-item__c{color:var(--text-dim);white-space:nowrap;}
    .gc-insp__n{color:var(--text-bright);font-size:1rem;letter-spacing:.5px;}
    .gc-insp__sub{color:var(--green);font-size:.62rem;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
    .gc-stat{color:var(--text-dim);font-size:.8rem;margin:6px 0;}
    .gc-meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.74rem;color:var(--text-dim);margin:8px 0;}
    .gc-meta b{color:var(--green-dim,#7fae86);font-weight:600;}
    .gc-meta select{background:var(--bg-input,#0a0f0c);color:var(--text-bright);border:1px solid #1a2a1a;font-family:inherit;font-size:.74rem;padding:3px 6px;vertical-align:middle;}
    .gc-rsel{width:52px;}
    .gc-opts{display:flex;flex-direction:column;gap:7px;}
    .gc-opt{display:flex;gap:8px;align-items:flex-start;cursor:pointer;}
    .gc-opt input{margin-top:1px;flex:none;}
    .gc-opt__b{display:flex;flex-direction:column;gap:1px;}
    .gc-opt__n{color:var(--text-bright);font-size:.8rem;}
    .gc-opt__c{color:var(--green-dim,#7fae86);font-size:.72rem;}
    .gc-opt__d{color:var(--text-dim);font-size:.72rem;line-height:1.35;}
    .gc-desc{color:var(--text-dim);font-size:.78rem;line-height:1.4;margin:8px 0;}
    .gc-blk{margin:8px 0;}
    .gc-blk h5{color:var(--green-dim,#7fae86);font-size:.6rem;letter-spacing:1px;text-transform:uppercase;margin:0 0 4px;}
    .gc-blk ul{margin:0;padding-left:16px;}
    .gc-blk li{color:var(--text-dim);font-size:.76rem;padding:1px 0;}
    .gc-raw{margin-top:10px;border-top:1px solid #142019;padding-top:8px;}
    .gc-raw table{width:100%;border-collapse:collapse;font-size:.72rem;}
    .gc-raw td{padding:2px 6px;vertical-align:top;border-bottom:1px solid #0f1a14;}
    .gc-raw td:first-child{color:var(--green-dim,#7fae86);white-space:nowrap;width:38%;}
    .gc-raw td:last-child{color:var(--text-dim);word-break:break-word;}
    .gc-add{display:flex;gap:8px;align-items:center;margin-top:10px;}
    .gc-add select,.gc-add input{background:var(--bg-input,#0a0f0c);color:var(--text-bright);border:1px solid #1a2a1a;padding:5px 8px;font-family:inherit;font-size:.78rem;}
    .gc-cart__row{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center;font-size:.76rem;padding:4px 0;border-bottom:1px solid #0f1a14;}
    .gc-cart__row .n{color:var(--text-bright);}
    .gc-cart__row .c{color:var(--text-dim);white-space:nowrap;}
    .gc-cart__x{background:none;border:none;color:var(--red,#c25b5b);cursor:pointer;font-size:.9rem;padding:0 2px;}
    .gc-cart__total{display:flex;justify-content:space-between;margin-top:10px;padding-top:8px;border-top:1px solid #24381f;color:var(--text-bright);font-size:.9rem;}
    .gc-count{color:var(--text-dim);font-size:.66rem;}
  </style>
</head>
<body>

<header>
  <div class="logo">Shadowrun <em>//</em> <span class="text-cyan" style="text-shadow: var(--glow-cyan)">NA/UCAS-SEA-6A23D-PENUMBRA</span></div>
  <nav>
    <a href="world-state.html">World State</a>
    <a href="manage-characters.html">Characters</a>
    <a href="manage-organizations.html">Organizations</a>
    <a href="manage-locations.html">Locations</a>
    <a href="manage-runs.html">Runs</a>
  </nav>
</header>

<main>
  <div class="page-title">&gt;&gt; Gear Catalog <em class="sep">//</em> Requisition &amp; Pricing</div>
  <div class="page-sub" style="color:var(--green)">BROWSE EVERY ITEM, INSPECT FULL STATS, BUILD A SHOPPING LIST</div>

  <div id="alert" class="alert"></div>

  <div class="tabs tabs--green" id="gcTabs"></div>
  <div class="gc-toolbar">
    <input type="text" id="gcSearch" placeholder="Search this category..." autocomplete="off">
    <span class="gc-count" id="gcCount"></span>
  </div>

  <div class="gc-grid">
    <div class="gc-panel">
      <h5 class="gc-panel__h">Items</h5>
      <div class="gc-list" id="gcList"><div class="loading">Loading catalog</div></div>
    </div>
    <div class="gc-panel">
      <h5 class="gc-panel__h">Inspector</h5>
      <div id="gcInsp"><p class="empty-state">Select an item to see its full stat block.</p></div>
    </div>
    <div class="gc-panel">
      <h5 class="gc-panel__h">Shopping List</h5>
      <div id="gcCart"></div>
    </div>
  </div>
</main>

<script>
const CATS = [
  { k: "weapons",   label: "Weapons" },
  { k: "armor",     label: "Armor" },
  { k: "cyberware", label: "Cyberware" },
  { k: "bioware",   label: "Bioware" },
  { k: "gear",      label: "Gear",   src: "gear", pick: it => it.cat !== "deck" },
  { k: "matrix",    label: "Matrix", src: "gear", pick: it => it.cat === "deck" },
  { k: "foci",      label: "Foci",   src: "foci" },
  { k: "vehicles",  label: "Vehicles" },
];
const FOCI_GROUP_ORDER = ["Spell Foci", "Spirit Foci", "Power Foci", "Weapon Foci"];
const CART_KEY = "sr2_gear_cart_v1";
const YEN = "\u00A5";
const DOT = " \u00B7 ";

let DATA = {};                 // cat key -> [items]
let curCat = "weapons";
let filter = "";
let selected = null;           // {cat, item}
let selRating = 1;             // chosen rating for a rated selected item
let selOpts = [];              // chosen add-on option names for the selected item
let cart = loadCart();         // [{cat, n, rating, qty, opts}]
let VEHICLE_CLASSES = {};       // name -> {skill, conc}; GM overlay for vehicle piloting groups

function money(n) { return (Number(n) || 0).toLocaleString("en-US") + YEN; }
function parseNum(v) {
  if (typeof v === "number") return v;
  if (typeof v !== "string") return 0;
  const m = v.replace(/,/g, "").match(/-?\d+(\.\d+)?/);
  return m ? Number(m[0]) : 0;
}
function loadCart() { try { return JSON.parse(localStorage.getItem(CART_KEY)) || []; } catch { return []; } }
function saveCart() { localStorage.setItem(CART_KEY, JSON.stringify(cart)); }

// Cost of one unit of an item at a given rating (uses costTbl for rated items) plus any selected options.
function unitCost(item, rating, opts) {
  let base = (item.rated && Array.isArray(item.costTbl) && item.costTbl[(rating || 1) - 1] != null)
    ? parseNum(item.costTbl[(rating || 1) - 1]) : parseNum(item.cost);
  if (Array.isArray(item.options) && Array.isArray(opts))
    item.options.forEach(o => { if (opts.includes(o.n)) base += parseNum(o.cost); });
  return base;
}
// Bonding Karma of one unit of a focus at a given rating (0 for non-magical items).
function unitKarma(item, rating) {
  if (!item) return 0;
  if (item.rated && Array.isArray(item.karmaTbl) && item.karmaTbl[(rating || 1) - 1] != null)
    return parseNum(item.karmaTbl[(rating || 1) - 1]);
  return parseNum(item.karma);
}
function catDef(k) { return CATS.find(c => c.k === k) || { k, label: k }; }
function catSrc(k) { const d = catDef(k); return d.src || d.k; }
function findItem(cat, n) { return (DATA[catSrc(cat)] || []).find(x => x.n === n); }

/* ---------- grouping helpers (shared taxonomy lives in catalog-taxonomy.js) ---------- */
function gcItemRow(it) {
  const sel = selected && selected.item.n === it.n && selected.cat === curCat;
  const cost = it.rated ? "rated" : (it.cost != null ? money(parseNum(it.cost)) : "--");
  return `<div class="gc-item ${sel ? "is-sel" : ""}" data-pick="${esc(it.n)}"><span>${esc(it.n)}</span><span class="gc-item__c">${esc(cost)}</span></div>`;
}
function sortItems(list, byPrice) {
  return list.slice().sort(byPrice
    ? (a, b) => parseNum(a.cost) - parseNum(b.cost)
    : (a, b) => (a.n || "").localeCompare(b.n || ""));
}
function orderedSections(items, labelFn, order) {
  const groups = {};
  items.forEach(it => { const g = labelFn(it); (groups[g] = groups[g] || []).push(it); });
  const extra = Object.keys(groups).filter(g => !order.includes(g)).sort((a, b) => a.localeCompare(b));
  return [...order, ...extra].map(g => ({ label: g, items: groups[g] || [] }));
}
function labelSections(items, labelFn) {
  const groups = {};
  items.forEach(it => { const g = labelFn(it); (groups[g] = groups[g] || []).push(it); });
  return Object.keys(groups).sort((a, b) => a.localeCompare(b)).map(g => ({ label: g, items: groups[g] }));
}
function sectionsFor(def, items) {
  const k = def.k;
  if (k === "weapons") return orderedSections(items, weaponGroupLabel, WEAPON_GROUP_ORDER);
  if (k === "armor") return orderedSections(items, armorGroupLabel, ARMOR_GROUP_ORDER);
  if (k === "gear") return labelSections(items, gearGroupLabel);
  if (k === "foci") return orderedSections(items, it => it.sub || "Foci", FOCI_GROUP_ORDER);
  if (k === "matrix") {
    const isComp = it => it.sub === "Cyberdeck Component";
    return [{ label: "Cyberdecks", items: items.filter(it => !isComp(it)) },
            { label: "Cyberdeck Components", items: items.filter(isComp) }];
  }
  if (k === "cyberware") return orderedSections(items, cyberGroupLabel, CYBER_GROUP_ORDER);
  return [{ label: null, items }];
}
function renderVehicleGroups(items) {
  const groups = {};
  items.forEach(v => { const t = vehicleSkillCategory(v); (groups[t] = groups[t] || []).push(v); });
  return VEHICLE_SKILL_ORDER.map(t => {
    const list = groups[t] || [];
    if (!list.length) return "";
    const subs = {};
    list.forEach(v => { const s = v.sub || "Other"; (subs[s] = subs[s] || []).push(v); });
    const inner = Object.keys(subs).sort((a, b) => a.localeCompare(b)).map(s =>
      `<div class="gc-subcat">${esc(s)}</div>${sortItems(subs[s], true).map(gcItemRow).join("")}`).join("");
    return `<div class="gc-cat">${esc(t)}</div>${inner}`;
  }).join("");
}

/* ---------- tabs / list ---------- */
function renderTabs() {
  document.getElementById("gcTabs").innerHTML = CATS.map(c =>
    `<button type="button" class="tab ${curCat === c.k ? "is-active" : ""}" data-cat="${c.k}">${esc(c.label)}</button>`).join("");
  document.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => {
    curCat = b.dataset.cat; selected = null; renderTabs(); renderList(); renderInspector();
  });
}

function renderList() {
  const def = catDef(curCat);
  const base = (DATA[def.src || def.k] || []).filter(def.pick || (() => true));
  const items = base
    .filter(it => { const q = filter.toLowerCase(); return !q || (it.n || "").toLowerCase().includes(q) || (it.sub || "").toLowerCase().includes(q); });
  document.getElementById("gcCount").textContent = `${items.length} item${items.length === 1 ? "" : "s"}`;
  const byPrice = (curCat === "vehicles" || curCat === "matrix");
  let html;
  if (curCat === "vehicles") {
    html = renderVehicleGroups(items);
  } else {
    html = sectionsFor(catDef(curCat), items).map(sec => {
      const rows = sortItems(sec.items, byPrice).map(gcItemRow).join("");
      if (!rows) return "";
      return (sec.label ? `<div class="gc-cat">${esc(sec.label)}</div>` : "") + rows;
    }).join("");
  }
  html = html || `<p class="empty-state">No matches.</p>`;
  const list = document.getElementById("gcList");
  list.innerHTML = html;
  list.querySelectorAll("[data-pick]").forEach(el => el.onclick = () => {
    const it = findItem(curCat, el.dataset.pick);
    selected = { cat: curCat, item: it };
    selRating = 1;
    selOpts = [];
    renderList(); renderInspector();
  });
}

/* ---------- inspector ---------- */
const HIDE_KEYS = new Set(["n", "cat", "sub", "desc", "notes", "effect", "stats", "options"]);

function statLine(it) {
  if (Array.isArray(it.stats) && it.stats.length)
    return it.stats.map(s => Array.isArray(s) ? `${esc(String(s[0]))} ${esc(String(s[1]))}` : esc(String(s))).join(DOT);
  const parts = [];
  const add = (k, v) => { if (v !== undefined && v !== null && v !== "") parts.push(`${k} ${esc(String(v))}`); };
  if ("conceal" in it) {   // weapons/armor: always show Conceal; a dash means none / NA
    const cv = it.conceal;
    const na = cv === null || cv === "" || ["NA", "N/A", "-"].includes(String(cv).toUpperCase());
    parts.push(`Conceal ${na ? "\u2014" : esc(String(cv))}`);
  }
  add("Reach", it.reach); add("Dmg", it.dmg); add("Mode", it.mode); add("Ammo", it.ammo);
  add("Ballistic", it.ballistic); add("Impact", it.impact);
  return parts.join(DOT);
}
function fmtVal(v) {
  if (v === null || v === undefined) return "";
  if (typeof v === "object") return esc(JSON.stringify(v));
  return esc(String(v));
}
function renderInspector() {
  const box = document.getElementById("gcInsp");
  if (!selected) { box.innerHTML = `<p class="empty-state">Select an item to see its full stat block.</p>`; return; }
  const it = selected.item;
  const sl = statLine(it);
  const meta = [];
  if (it.rated) {
    const opts = Array.from({ length: Math.max(1, Number(it.maxRating) || 1) }, (_, i) => i + 1)
      .map(r => `<option value="${r}" ${r === selRating ? "selected" : ""}>${r}</option>`).join("");
    meta.push(`<span><b>Rating</b> <select id="gcRating" class="gc-rsel">${opts}</select></span>`);
    meta.push(`<span><b>Cost</b> ${money(unitCost(it, selRating))}</span>`);
    if (Array.isArray(it.essTbl) && it.essTbl[selRating - 1] != null) meta.push(`<span><b>Essence</b> ${esc(String(it.essTbl[selRating - 1]))}</span>`);
  } else {
    if (it.cost != null) meta.push(`<span><b>Cost</b> ${money(unitCost(it, selRating, selOpts))}</span>`);
    if (it.ess != null) {
      const optEss = Array.isArray(it.options) ? it.options.reduce((a, o) => a + (selOpts.includes(o.n) ? (Number(o.ess) || 0) : 0), 0) : 0;
      const totEss = Math.round(((Number(it.ess) || 0) + optEss) * 100) / 100;
      meta.push(`<span><b>Essence</b> ${esc(String(totEss))}</span>`);
    }
  }
  const kv = unitKarma(it, selRating);
  if (kv) meta.push(`<span><b>Bonding</b> <span class="text-amber">${kv} Karma</span></span>`);
  if (it.avail) meta.push(`<span><b>Avail</b> ${esc(String(it.avail))}</span>`);
  if (it.index != null) meta.push(`<span><b>Index</b> ${esc(String(it.index))}</span>`);
  if (it.legal) meta.push(`<span><b>Legal</b> ${esc(String(it.legal))}</span>`);
  if (it.src) meta.push(`<span><b>Source</b> ${esc(String(it.src))}${it.pg ? " p." + esc(String(it.pg)) : ""}</span>`);

  const notes = Array.isArray(it.notes) && it.notes.length
    ? `<div class="gc-blk"><h5>Notes</h5><ul>${it.notes.map(x => `<li>${esc(String(x))}</li>`).join("")}</ul></div>` : "";
  const effect = Array.isArray(it.effect) && it.effect.length
    ? `<div class="gc-blk"><h5>Effect</h5><ul>${it.effect.map(x => `<li>${esc(String(x))}</li>`).join("")}</ul></div>` : "";
  const optionsBlk = Array.isArray(it.options) && it.options.length
    ? `<div class="gc-blk"><h5>Options</h5><div class="gc-opts">${it.options.map(o => {
        const on = selOpts.includes(o.n);
        const bits = [money(parseNum(o.cost))];
        if (Number(o.ess)) bits.push(esc(String(o.ess)) + " Ess");
        if (o.index != null) bits.push("Index " + esc(String(o.index)));
        if (o.avail) bits.push("Avail " + esc(String(o.avail)));
        return `<label class="gc-opt"><input type="checkbox" class="chk-reveal" data-opt="${esc(o.n)}"${on ? " checked" : ""}>
          <span class="gc-opt__b"><span class="gc-opt__n">${esc(o.n)} <span class="gc-opt__c">${bits.join(DOT)}</span></span>
          ${o.desc ? `<span class="gc-opt__d">${esc(o.desc)}</span>` : ""}</span></label>`;
      }).join("")}</div></div>` : "";
  // Full data dump so nothing needed for the sheet is hidden.
  const rawRows = Object.keys(it).filter(k => !HIDE_KEYS.has(k) && !["cost", "ess", "avail", "index", "legal", "src", "pg"].includes(k))
    .map(k => `<tr><td>${esc(k)}</td><td>${fmtVal(it[k])}</td></tr>`).join("");
  const raw = rawRows ? `<div class="gc-raw"><table>${rawRows}</table></div>` : "";

  box.innerHTML = `
    <div class="gc-insp__n">${esc(it.n)}</div>
    <div class="gc-insp__sub">${esc(it.cat || "")}${it.sub ? " " + DOT + " " + esc(it.sub) : ""}</div>
    ${sl ? `<div class="gc-stat">${sl}</div>` : ""}
    <div class="gc-meta">${meta.join("")}</div>
    ${it.desc ? `<div class="gc-desc">${esc(it.desc)}</div>` : ""}
    ${effect}${optionsBlk}${notes}
    <div class="gc-add">
      <input type="number" id="gcQty" min="1" value="1" style="width:56px" title="Quantity">
      <button type="button" class="btn btn-green btn-sm" id="gcAdd">+ Add to list</button>
    </div>
    ${raw}`;
  const rsel = document.getElementById("gcRating");
  if (rsel) rsel.onchange = () => { selRating = Number(rsel.value) || 1; renderInspector(); };
  box.querySelectorAll("[data-opt]").forEach(cb => cb.onchange = () => {
    const nm = cb.dataset.opt;
    if (cb.checked) { if (!selOpts.includes(nm)) selOpts.push(nm); }
    else selOpts = selOpts.filter(x => x !== nm);
    renderInspector();
  });
  document.getElementById("gcAdd").onclick = () => {
    const qty = Math.max(1, Number(document.getElementById("gcQty").value) || 1);
    addToCart(selected.cat, it, it.rated ? selRating : null, qty, selOpts.slice());
  };
}

/* ---------- shopping list ---------- */
function addToCart(cat, item, rating, qty, opts) {
  opts = opts || [];
  const key = opts.slice().sort().join("|");
  const existing = cart.find(e => e.cat === cat && e.n === item.n && (e.rating || null) === (rating || null)
    && (e.opts || []).slice().sort().join("|") === key);
  if (existing) existing.qty += qty;
  else cart.push({ cat, n: item.n, rating: rating || null, qty, opts });
  saveCart(); renderCart();
  showAlert(document.getElementById("alert"), `>> ADDED // ${item.n}${rating ? " R" + rating : ""}${opts.length ? " +" + opts.length + " opt" : ""} x${qty}`, false);
}
function renderCart() {
  const box = document.getElementById("gcCart");
  if (!cart.length) { box.innerHTML = `<p class="empty-state">Empty. Add items from the inspector to price them.</p>`; return; }
  let total = 0, totalKarma = 0;
  const rows = cart.map((e, i) => {
    const it = findItem(e.cat, e.n) || {};
    const unit = unitCost(it, e.rating, e.opts);
    const line = unit * e.qty;
    const kLine = unitKarma(it, e.rating) * e.qty;
    total += line;
    totalKarma += kLine;
    return `<div class="gc-cart__row">
      <span class="n">${esc(e.n)}${e.rating ? " <span class='c'>R" + e.rating + "</span>" : ""}${(e.opts && e.opts.length) ? " <span class='c'>+ " + esc(e.opts.join(", ")) + "</span>" : ""}</span>
      <span class="c">x${e.qty}</span>
      <span class="c">${money(line)}${kLine ? " <span class='text-amber'>+ " + kLine + " Karma</span>" : ""}</span>
      <button type="button" class="gc-cart__x" data-del="${i}" title="Remove">&#10005;</button>
    </div>`;
  }).join("");
  box.innerHTML = rows +
    `<div class="gc-cart__total"><span>Total</span><span>${money(total)}</span></div>
     ${totalKarma ? `<div class="gc-cart__total"><span>Bonding Karma</span><span class="text-amber">${totalKarma} Karma</span></div>` : ""}
     <div class="mt-10 flex-row-8">
       <button type="button" class="btn btn-ghost btn-sm" id="gcClear">Clear list</button>
     </div>`;
  box.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { cart.splice(Number(b.dataset.del), 1); saveCart(); renderCart(); });
  document.getElementById("gcClear").onclick = () => { cart = []; saveCart(); renderCart(); };
}

/* ---------- boot ---------- */
async function loadAll() {
  try {
    const srcs = [...new Set(CATS.map(c => c.src || c.k))];
    const results = await Promise.all(srcs.map(s =>
      apiFetch("/catalog/" + s).then(r => r.ok ? r.json() : { items: [] }).catch(() => ({ items: [] }))));
    srcs.forEach((s, i) => { DATA[s] = (results[i] && results[i].items) || []; });
    const vc = await apiFetch("/catalog/vehicle-classes").then(r => r.ok ? r.json() : null).catch(() => null);
    VEHICLE_CLASSES = (vc && vc.classes) || {};
    renderTabs(); renderList(); renderInspector(); renderCart();
  } catch (e) {
    document.getElementById("gcList").innerHTML = "";
    showAlert(document.getElementById("alert"), `>> LOAD FAILED // ${e.message}`, true);
  }
}
document.getElementById("gcSearch").addEventListener("input", (e) => { filter = e.target.value; renderList(); });
bootstrapAuth().then(u => { if (u) loadAll(); });
</script>
</body>
